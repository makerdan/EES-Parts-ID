name: Scheduled security audit

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Daily dependency audit (low+)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Audit dependencies (fail on low/moderate/high/critical)
        shell: bash
        run: pnpm audit --audit-level=low