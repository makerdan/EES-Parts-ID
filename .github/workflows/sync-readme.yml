name: Sync README from replit.md

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  sync:
    name: Copy replit.md → README.md
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the commit back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy replit.md to README.md
        run: cp replit.md README.md

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md is already up to date — nothing to commit."
          else
            git commit -m "docs: sync README.md from replit.md [skip ci]"
            git push
          fi
