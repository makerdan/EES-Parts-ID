name: Sync README from replit.md

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    name: Copy replit.md → README.md
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout default branch for maintenance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Copy replit.md to README.md
        shell: bash
        run: cp replit.md README.md

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md is already up to date — nothing to commit."
          else
            git commit -m "docs: sync README.md from replit.md [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi