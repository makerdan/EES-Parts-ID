name: LiDAR Measure Tests

on:
  pull_request:

jobs:
  lidar-measure-tests:
    name: Run LidarMeasureTests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (generates ios/)
        working-directory: artifacts/parts-id
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            artifacts/parts-id/ios/Pods
            ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('artifacts/parts-id/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Pod install
        working-directory: artifacts/parts-id/ios
        run: pod install

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Run LidarMeasureTests
        working-directory: artifacts/parts-id
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace ios/PartsID.xcworkspace \
            -scheme lidar-measure-LidarMeasureTests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            | xcpretty
