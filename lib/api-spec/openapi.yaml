openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventory
    description: Inventory management and search
  - name: dictionaries
    description: Dictionary lookups
  - name: ai
    description: AI identification and reference
  - name: categories
    description: Three-level taxonomy browse and classification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryListResponse"

  /inventory/search:
    post:
      operationId: searchInventory
      tags: [inventory]
      summary: Search inventory with multi-strategy cascade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInventoryBody"
      responses:
        "200":
          description: Search results with confidence scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchInventoryResponse"

  /inventory/upsert-batch:
    post:
      operationId: upsertInventoryBatch
      tags: [inventory]
      summary: Add or update inventory items (upsert by vendor+catalog)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertInventoryBody"
      responses:
        "200":
          description: Upsert summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertInventoryResponse"

  /inventory/preview-upsert:
    post:
      operationId: previewUpsertInventory
      tags: [inventory]
      summary: Classify a batch of rows against existing inventory without writing
      description: |
        Classifies each (vendor, catalog) row as `new` (no match), `binChanged`
        (match exists and the merged bin set differs), `descChanged` (match
        exists and the proposed description differs), or `unchanged`. A row may
        be tagged with both `binChanged` and `descChanged`. No database writes
        are performed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewUpsertBody"
      responses:
        "200":
          description: Classification summary plus per-match details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewUpsertResponse"

  /inventory/enrich:
    post:
      operationId: enrichInventory
      tags: [inventory]
      summary: AI enrich inventory items with keywords (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichInventoryBody"
      responses:
        "200":
          description: SSE stream of enrichment progress
          content:
            text/event-stream: {}

  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item's description and/or AI keywords
      description: |
        Updates only the fields provided in the request body. A blank
        description string is treated as a real edit (the worker explicitly
        cleared it); only `undefined` / missing means "do not change". At
        least one of `description` or `keywords` must be supplied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemBody"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{id}/suggest-description:
    post:
      operationId: suggestItemDescription
      tags: [inventory]
      summary: Generate an AI-recommended improved description for a part
      description: |
        Returns a single 1–2 sentence improved description that folds the
        most important AI keywords into natural prose, preserving any
        specifics already in the existing description. Nothing is saved —
        the caller decides whether to apply the suggestion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suggested description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestDescriptionResponse"

  /dictionaries/lookup:
    get:
      operationId: lookupDictionary
      tags: [dictionaries]
      summary: Lookup a term across all dictionaries
      parameters:
        - name: term
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dictionary lookup results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryLookupResponse"

  /ai/identify:
    post:
      operationId: aiIdentifyPart
      tags: [ai]
      summary: Identify electrical part from images using AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiIdentifyBody"
      responses:
        "200":
          description: AI identification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiIdentifyResponse"

  /reference/ask:
    post:
      operationId: askReference
      tags: [ai]
      summary: Ask a question about electrical terms (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiReferenceBody"
      responses:
        "200":
          description: SSE stream of answer chunks
          content:
            text/event-stream: {}

  /categories/tree:
    get:
      operationId: getCategoryTree
      tags: [categories]
      summary: Get the full three-level taxonomy with item counts
      responses:
        "200":
          description: Nested taxonomy tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryTreeResponse"

  /categories/coverage:
    get:
      operationId: getCategoryCoverage
      tags: [categories]
      summary: Classification coverage stats (total / classified / by source)
      responses:
        "200":
          description: Coverage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCoverageResponse"

  /categories/uncategorized:
    get:
      operationId: listUncategorizedItems
      tags: [categories]
      summary: List inventory items not yet placed in any category
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated uncategorized items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryListResponse"

  /categories/{slug}/items:
    get:
      operationId: listCategoryItems
      tags: [categories]
      summary: List inventory items under a category, subcategory, or type
      description: |
        Items assigned to the node identified by `slug` OR to any of its
        descendants are returned. This way `/categories/breakers/items`
        returns every breaker (across subcategories), while
        `/categories/breaker-gfci/items` returns only the GFCI leaf.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated items under the node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryItemsResponse"

  /categories/classify:
    post:
      operationId: classifyInventory
      tags: [categories]
      summary: Run the rule-based classifier across inventory (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyInventoryBody"
      responses:
        "200":
          description: SSE stream of classification progress
          content:
            text/event-stream: {}

  /categories/{nodeId}/assign:
    post:
      operationId: assignInventoryToCategory
      tags: [categories]
      summary: Manually assign one inventory item to a taxonomy node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCategoryBody"
      responses:
        "200":
          description: Assignment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignCategoryResponse"

  /ai/reference:
    post:
      operationId: aiReference
      tags: [ai]
      deprecated: true
      summary: "[Deprecated] Use /reference/ask instead"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiReferenceBody"
      responses:
        "308":
          description: Redirect to /reference/ask

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    InventoryItem:
      type: object
      properties:
        id:
          type: integer
        vendor:
          type: string
        catalog:
          type: string
        description:
          type: string
        binLocations:
          type: array
          items:
            type: string
          description: "Every bin this part is currently stocked in. Empty array means no bin assigned."
        aiKeywords:
          type: array
          items:
            type: string
        enrichedAt:
          type: string
          format: date-time
          nullable: true
        vendorFullName:
          type: string
          nullable: true
          description: |
            Canonical full name for the vendor (e.g. "Eaton" for `ETN`),
            resolved from the `vendor_map` table by case-insensitive match
            on `vendor_map.code`. `null` when no mapping exists.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - vendor
        - catalog
        - description
        - binLocations
        - aiKeywords
        - createdAt
        - updatedAt

    InventoryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - items
        - total
        - page
        - limit

    SearchInventoryBody:
      type: object
      properties:
        keywords:
          type: string
        catalog:
          type: string
        vendor:
          type: string
        color:
          type: string
        size:
          type: string
        material:
          type: string
        textNumbers:
          type: string
        confidenceThreshold:
          type: number
          description: Minimum confidence percentage (0–100); default 50
          minimum: 0
          maximum: 100
          default: 50
        category:
          type: string
          description: Part category / type chip filter
        amperage:
          type: string
          description: Current rating chip filter
        colorChip:
          type: string
          description: Color quick-pick chip filter
        manufacturer:
          type: string
          description: Major manufacturer chip filter
        sizeChip:
          type: string
          description: Trade size quick-pick chip filter
        rating:
          type: string
          description: NEMA / IP / UL rating chip filter
        wireType:
          type: string
          description: Wire insulation type chip filter
        wireGauge:
          type: string
          description: AWG gauge chip filter
        conduitType:
          type: string
          description: Conduit material/type chip filter
        conduitSize:
          type: string
          description: Conduit trade size chip filter
        boxType:
          type: string
          description: Electrical box type chip filter
        boxGangCount:
          type: string
          description: Box gang count chip filter
        mountingType:
          type: string
          description: Mounting method chip filter
        environment:
          type: string
          description: Installation environment chip filter
        voltage:
          type: string
          description: Voltage rating chip filter
        poleCount:
          type: string
          description: Pole count chip filter (breakers/switches)
      required: []

    SearchResult:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/InventoryItem"
        confidence:
          type: number
        matchReason:
          type: string
        seriesBase:
          type: string
          nullable: true
        seriesLabel:
          type: string
          nullable: true
        variants:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
      required:
        - item
        - confidence
        - matchReason
        - variants

    SearchInventoryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        totalMatches:
          type: integer
        belowThreshold:
          type: integer
        dimensionCounts:
          type: object
          description: Per-chip-dimension live match counts (dimKey → optionLabel → count)
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
      required:
        - results
        - totalMatches
        - belowThreshold

    UpsertInventoryItem:
      type: object
      properties:
        vendor:
          type: string
        catalog:
          type: string
        description:
          type: string
          description: "Proposed description. Blank/missing values never overwrite an existing description."
        binLocations:
          type: array
          items:
            type: string
          description: "Bins to merge into the part's bin list (additive — existing bins are preserved)."
      required:
        - vendor
        - catalog

    SelectedKey:
      type: object
      description: "Identifies a single existing-item update to apply when mode is `selected`. Match is case-insensitive."
      properties:
        vendor:
          type: string
        catalog:
          type: string
      required:
        - vendor
        - catalog

    UpsertInventoryBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpsertInventoryItem"
        mode:
          type: string
          enum:
            - add-new-only
            - overwrite-all
            - selected
          default: overwrite-all
          description: |
            Controls how existing matches are handled:
            - `add-new-only`: only insert rows whose (vendor, catalog) does not exist; never modify existing rows.
            - `overwrite-all`: insert new rows; for matches, additively merge bins and replace description (when proposed description is non-empty). Vendor/catalog text on existing rows is never modified.
            - `selected`: insert new rows; only update existing matches whose (vendor, catalog) appears in `selectedKeys`.
        selectedKeys:
          type: array
          items:
            $ref: "#/components/schemas/SelectedKey"
          description: "Required when `mode = selected`. Existing matches NOT in this list are skipped."
      required:
        - items

    # NOTE on counts: `total` is the number of distinct (vendor, catalog) rows
    # processed AFTER server-side de-duplication (case-insensitive on both
    # vendor and catalog). `inserted + updated + skipped === total`.
    UpsertInventoryResponse:
      type: object
      properties:
        inserted:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
          description: "Existing matches that were intentionally not updated (e.g. mode=add-new-only or not in selectedKeys)."
        total:
          type: integer
      required:
        - inserted
        - updated
        - skipped
        - total

    PreviewUpsertBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpsertInventoryItem"
      required:
        - items

    PreviewMatchRow:
      type: object
      description: "An incoming row that matched an existing inventory item. Includes the current stored values and the proposed merged values."
      properties:
        vendor:
          type: string
          description: "Vendor as stored in the DB (its original casing is preserved)."
        catalog:
          type: string
          description: "Catalog as stored in the DB."
        existingDescription:
          type: string
        proposedDescription:
          type: string
          description: "Description that will be written if this row is included in an `overwrite-all`/`selected` apply. Empty proposed description means description will not change."
        existingBinLocations:
          type: array
          items:
            type: string
        proposedBinLocations:
          type: array
          items:
            type: string
          description: "Bin list after additive merge of incoming bins into the existing list."
        binChanged:
          type: boolean
        descChanged:
          type: boolean
      required:
        - vendor
        - catalog
        - existingDescription
        - proposedDescription
        - existingBinLocations
        - proposedBinLocations
        - binChanged
        - descChanged

    PreviewUpsertResponse:
      type: object
      properties:
        newCount:
          type: integer
          description: "Rows whose (vendor, catalog) does not exist in the DB."
        changedCount:
          type: integer
          description: "Existing matches where bin and/or description would change."
        unchangedCount:
          type: integer
          description: "Existing matches where nothing would change."
        totalIncoming:
          type: integer
          description: "Number of distinct (vendor, catalog) rows after de-duplication."
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PreviewMatchRow"
          description: "Per-row details for every existing match that would change. Unchanged matches are NOT included."
      required:
        - newCount
        - changedCount
        - unchangedCount
        - totalIncoming
        - changes

    EnrichInventoryBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          description: Inventory IDs to enrich. If empty, enriches all un-enriched items.
      required: []

    UpdateInventoryItemBody:
      type: object
      description: |
        Partial update for an inventory item. Only the fields explicitly
        provided are touched. Sending `description: ""` is a real edit
        (clears the description); omit the field entirely to leave it
        untouched. At least one field must be supplied.
      properties:
        description:
          type: string
          description: New description text. Empty string clears the description.
        keywords:
          type: array
          items:
            type: string
          description: Replacement AI keywords array.
      required: []

    SuggestDescriptionResponse:
      type: object
      properties:
        description:
          type: string
          description: AI-suggested description (1–2 sentences).
      required:
        - description

    DictionaryLookupResponse:
      type: object
      properties:
        abbreviations:
          type: array
          items:
            type: string
        synonyms:
          type: array
          items:
            type: string
        correction:
          type: string
          nullable: true
        vendorNames:
          type: array
          items:
            type: string
        slangTerms:
          type: array
          items:
            type: string
      required:
        - abbreviations
        - synonyms
        - vendorNames
        - slangTerms

    AiIdentifyBody:
      type: object
      properties:
        images:
          type: array
          items:
            type: string
            description: Base64-encoded image data (data URI)
          maxItems: 2
        keywords:
          type: string
        vendor:
          type: string
        color:
          type: string
        size:
          type: string
        material:
          type: string
        textNumbers:
          type: string
      required:
        - images

    AiIdentifyResponse:
      type: object
      properties:
        searchTerms:
          type: array
          items:
            type: string
        synonyms:
          type: array
          items:
            type: string
        relatedTerms:
          type: array
          items:
            type: string
        manufacturerVerified:
          type: boolean
        detectedVendor:
          type: string
          nullable: true
        summary:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
      required:
        - searchTerms
        - synonyms
        - relatedTerms
        - manufacturerVerified
        - summary
        - results

    AiReferenceBody:
      type: object
      properties:
        question:
          type: string
      required:
        - question

    CategoryNode:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        level:
          type: string
          description: "category | subcategory | type"
        sortOrder:
          type: integer
        itemCount:
          type: integer
          description: "Total inventory items assigned at this node OR any descendant."
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"
      required:
        - id
        - slug
        - name
        - level
        - sortOrder
        - itemCount
        - children

    CategoryTreeResponse:
      type: object
      properties:
        tree:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"
      required:
        - tree

    CategoryCoverageResponse:
      type: object
      properties:
        total:
          type: integer
        classified:
          type: integer
        uncategorized:
          type: integer
        bySource:
          type: object
          additionalProperties:
            type: integer
          description: "Count of distinct items classified by each method (rule/ai/manual)."
      required:
        - total
        - classified
        - uncategorized
        - bySource

    CategoryItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        node:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
            level:
              type: string
          required:
            - slug
            - name
            - level
      required:
        - items
        - total
        - page
        - limit
        - node

    ClassifyInventoryBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          description: "Specific inventory ids to classify. If omitted, all items are considered."
        onlyUnclassified:
          type: boolean
          default: true
          description: "When true (default), skip items that already have an assignment."
        useAi:
          type: boolean
          default: false
          description: "When true, fall back to AI for items the rule classifier could not place. Disabled by default to avoid surprise OpenAI charges."

    AssignCategoryBody:
      type: object
      properties:
        inventoryId:
          type: integer
      required:
        - inventoryId

    AssignCategoryResponse:
      type: object
      properties:
        ok:
          type: boolean
        inventoryId:
          type: integer
        nodeId:
          type: integer
      required:
        - ok
        - inventoryId
        - nodeId
