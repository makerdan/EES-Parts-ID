openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventory
    description: Inventory management and search
  - name: dictionaries
    description: Dictionary lookups
  - name: ai
    description: AI identification and reference
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryListResponse"

  /inventory/search:
    post:
      operationId: searchInventory
      tags: [inventory]
      summary: Search inventory with multi-strategy cascade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInventoryBody"
      responses:
        "200":
          description: Search results with confidence scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchInventoryResponse"

  /inventory/upsert-batch:
    post:
      operationId: upsertInventoryBatch
      tags: [inventory]
      summary: Add or update inventory items (upsert by vendor+catalog)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertInventoryBody"
      responses:
        "200":
          description: Upsert summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertInventoryResponse"

  /inventory/enrich:
    post:
      operationId: enrichInventory
      tags: [inventory]
      summary: AI enrich inventory items with keywords (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichInventoryBody"
      responses:
        "200":
          description: SSE stream of enrichment progress
          content:
            text/event-stream: {}

  /inventory/{id}/bins:
    patch:
      operationId: updateItemBins
      tags: [inventory]
      summary: Replace the bin-locations array on a single inventory item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBinsBody"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "401":
          description: Admin token required
        "404":
          description: Item not found

  /inventory/barcode/{code}:
    get:
      operationId: lookupByBarcode
      tags: [inventory]
      summary: Look up an inventory item by barcode value
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matched inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: No item with that barcode

  /inventory/{id}/barcodes:
    patch:
      operationId: updateItemBarcodes
      tags: [inventory]
      summary: Replace the barcodes array on a single inventory item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBarcodesBody"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "401":
          description: Admin token required
        "404":
          description: Item not found

  /inventory/{id}/description:
    patch:
      operationId: updateItemDescription
      tags: [inventory]
      summary: Update the description for a single inventory item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDescriptionBody"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "401":
          description: Admin token required
        "404":
          description: Item not found

  /inventory/{id}/keywords:
    patch:
      operationId: updateItemKeywords
      tags: [inventory]
      summary: Manually update keywords for an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKeywordsBody"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /dictionaries/lookup:
    get:
      operationId: lookupDictionary
      tags: [dictionaries]
      summary: Lookup a term across all dictionaries
      parameters:
        - name: term
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dictionary lookup results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryLookupResponse"

  /ai/identify:
    post:
      operationId: aiIdentifyPart
      tags: [ai]
      summary: Identify electrical part from images using AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiIdentifyBody"
      responses:
        "200":
          description: AI identification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiIdentifyResponse"

  /reference/ask:
    post:
      operationId: askReference
      tags: [ai]
      summary: Ask a question about electrical terms (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiReferenceBody"
      responses:
        "200":
          description: SSE stream of answer chunks
          content:
            text/event-stream: {}

  /warehouse-zones:
    get:
      operationId: listWarehouseZones
      tags: [inventory]
      summary: List all warehouse zone overlays
      responses:
        "200":
          description: List of warehouse zones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseZoneListResponse"
    post:
      operationId: createWarehouseZone
      tags: [inventory]
      summary: Create a warehouse zone overlay (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarehouseZoneBody"
      responses:
        "201":
          description: Created zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseZoneResponse"
        "401":
          description: Admin token required

  /warehouse-zones/{id}:
    patch:
      operationId: updateWarehouseZone
      tags: [inventory]
      summary: Update a warehouse zone overlay (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWarehouseZoneBody"
      responses:
        "200":
          description: Updated zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseZoneResponse"
        "401":
          description: Admin token required
        "404":
          description: Zone not found
    delete:
      operationId: deleteWarehouseZone
      tags: [inventory]
      summary: Delete a warehouse zone overlay (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                required:
                  - deleted
        "401":
          description: Admin token required
        "404":
          description: Zone not found

  /ai/reference:
    post:
      operationId: aiReference
      tags: [ai]
      deprecated: true
      summary: "[Deprecated] Use /reference/ask instead"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiReferenceBody"
      responses:
        "308":
          description: Redirect to /reference/ask

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    InventoryItem:
      type: object
      properties:
        id:
          type: integer
        vendor:
          type: string
        catalog:
          type: string
        description:
          type: string
        binLocations:
          type: array
          items:
            type: string
          description: Bin locations where this part is stored (a part may live in multiple bins)
        aiKeywords:
          type: array
          items:
            type: string
        barcodes:
          type: array
          items:
            type: string
          description: Barcode values associated with this part
        enrichedAt:
          type: string
          format: date-time
          nullable: true
        imageUrl:
          type: string
          nullable: true
          description: URL of the catalog image extracted from a PDF import, served via the API proxy
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - vendor
        - catalog
        - description
        - binLocations
        - aiKeywords
        - barcodes
        - createdAt
        - updatedAt

    InventoryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - items
        - total
        - page
        - limit

    SearchInventoryBody:
      type: object
      properties:
        keywords:
          type: string
        catalog:
          type: string
        vendor:
          type: string
        color:
          type: string
        size:
          type: string
        material:
          type: string
        textNumbers:
          type: string
        confidenceThreshold:
          type: number
          description: Minimum confidence percentage (0–100); default 50
          minimum: 0
          maximum: 100
          default: 50
        category:
          type: string
          description: Part category / type chip filter
        amperage:
          type: string
          description: Current rating chip filter
        colorChip:
          type: string
          description: Color quick-pick chip filter
        manufacturer:
          type: string
          description: Major manufacturer chip filter
        sizeChip:
          type: string
          description: Trade size quick-pick chip filter
        rating:
          type: string
          description: NEMA / IP / UL rating chip filter
        wireType:
          type: string
          description: Wire insulation type chip filter
        wireGauge:
          type: string
          description: AWG gauge chip filter
        conduitType:
          type: string
          description: Conduit material/type chip filter
        conduitSize:
          type: string
          description: Conduit trade size chip filter
        boxType:
          type: string
          description: Electrical box type chip filter
        boxGangCount:
          type: string
          description: Box gang count chip filter
        mountingType:
          type: string
          description: Mounting method chip filter
        environment:
          type: string
          description: Installation environment chip filter
        voltage:
          type: string
          description: Voltage rating chip filter
        poleCount:
          type: string
          description: Pole count chip filter (breakers/switches)
      required: []

    SearchResult:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/InventoryItem"
        confidence:
          type: number
        matchReason:
          type: string
        seriesBase:
          type: string
          nullable: true
        seriesLabel:
          type: string
          nullable: true
        variants:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
      required:
        - item
        - confidence
        - matchReason
        - variants

    SearchInventoryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        totalMatches:
          type: integer
        belowThreshold:
          type: integer
        dimensionCounts:
          type: object
          description: Per-chip-dimension live match counts (dimKey → optionLabel → count)
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
      required:
        - results
        - totalMatches
        - belowThreshold

    UpsertInventoryBody:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              vendor:
                type: string
              catalog:
                type: string
              description:
                type: string
              binLocations:
                type: array
                items:
                  type: string
                description: Bin locations for this part (omit or pass empty array to clear)
            required:
              - vendor
              - catalog
      required:
        - items

    UpsertInventoryResponse:
      type: object
      properties:
        inserted:
          type: integer
        updated:
          type: integer
        total:
          type: integer
      required:
        - inserted
        - updated
        - total

    EnrichInventoryBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          description: Inventory IDs to enrich. If empty, enriches all un-enriched items.
      required: []

    UpdateBinsBody:
      type: object
      properties:
        binLocations:
          type: array
          items:
            type: string
          description: Replacement bin-location list. Pass [] to clear all bins.
      required:
        - binLocations

    UpdateBarcodesBody:
      type: object
      properties:
        barcodes:
          type: array
          items:
            type: string
          description: Replacement barcode list. Pass [] to clear all barcodes.
      required:
        - barcodes

    UpdateKeywordsBody:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
      required:
        - keywords

    UpdateDescriptionBody:
      type: object
      properties:
        description:
          type: string
          description: Free-text description of the part
      required:
        - description

    DictionaryLookupResponse:
      type: object
      properties:
        abbreviations:
          type: array
          items:
            type: string
        synonyms:
          type: array
          items:
            type: string
        correction:
          type: string
          nullable: true
        vendorNames:
          type: array
          items:
            type: string
        slangTerms:
          type: array
          items:
            type: string
      required:
        - abbreviations
        - synonyms
        - vendorNames
        - slangTerms

    AiIdentifyBody:
      type: object
      properties:
        images:
          type: array
          items:
            type: string
            description: Base64-encoded image data (data URI)
          maxItems: 2
        keywords:
          type: string
        vendor:
          type: string
        color:
          type: string
        size:
          type: string
        material:
          type: string
        textNumbers:
          type: string
      required:
        - images

    AiIdentifyResponse:
      type: object
      properties:
        searchTerms:
          type: array
          items:
            type: string
        synonyms:
          type: array
          items:
            type: string
        relatedTerms:
          type: array
          items:
            type: string
        manufacturerVerified:
          type: boolean
        detectedVendor:
          type: string
          nullable: true
        summary:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
      required:
        - searchTerms
        - synonyms
        - relatedTerms
        - manufacturerVerified
        - summary
        - results

    WarehouseZoneItem:
      type: object
      properties:
        id:
          type: integer
        aisleId:
          type: string
        label:
          type: string
        sectionParity:
          type: string
          enum: [odd, even, all]
        isInventory:
          type: boolean
        svgX:
          type: number
        svgY:
          type: number
        svgWidth:
          type: number
        svgHeight:
          type: number
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - aisleId
        - label
        - sectionParity
        - isInventory
        - svgX
        - svgY
        - svgWidth
        - svgHeight
        - sortOrder
        - createdAt
        - updatedAt

    WarehouseZoneListResponse:
      type: object
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseZoneItem"
      required:
        - zones

    WarehouseZoneResponse:
      type: object
      properties:
        zone:
          $ref: "#/components/schemas/WarehouseZoneItem"
      required:
        - zone

    CreateWarehouseZoneBody:
      type: object
      properties:
        aisleId:
          type: string
        label:
          type: string
        sectionParity:
          type: string
          enum: [odd, even, all]
        isInventory:
          type: boolean
        svgX:
          type: number
        svgY:
          type: number
        svgWidth:
          type: number
        svgHeight:
          type: number
        sortOrder:
          type: integer
      required:
        - aisleId
        - label
        - svgX
        - svgY
        - svgWidth
        - svgHeight

    UpdateWarehouseZoneBody:
      type: object
      properties:
        aisleId:
          type: string
        label:
          type: string
        sectionParity:
          type: string
          enum: [odd, even, all]
        isInventory:
          type: boolean
        svgX:
          type: number
        svgY:
          type: number
        svgWidth:
          type: number
        svgHeight:
          type: number
        sortOrder:
          type: integer

    AiReferenceBody:
      type: object
      properties:
        question:
          type: string
      required:
        - question
