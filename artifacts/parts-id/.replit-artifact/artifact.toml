kind = "mobile"
previewPath = "/"
title = "Parts ID"
version = "1.0.0"
id = "artifacts/parts-id"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22660

[services.development]
run = "pnpm --filter @workspace/parts-id run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/parts-id", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/parts-id", "run", "serve" ]

[services.env]
PORT = "22660"
BASE_PATH = "/"
